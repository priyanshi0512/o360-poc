spring.application.name=o360-poc

# --- Write datasource (source of truth: order_events) ---
write.datasource.url=${WRITE_DB_URL:jdbc:postgresql://localhost:5433/o360_write}
write.datasource.username=${WRITE_DB_USERNAME:postgres}
write.datasource.password=${WRITE_DB_PASSWORD:postgres}

# --- Read datasource (projection/read store: orders, order_items) ---
read.datasource.url=${READ_DB_URL:jdbc:postgresql://localhost:5434/o360_read}
read.datasource.username=${READ_DB_USERNAME:postgres}
read.datasource.password=${READ_DB_PASSWORD:postgres}

# --- JPA / Hibernate ---
spring.jpa.open-in-view=false

# Flyway auto-configuration is disabled; each datasource runs its own Flyway
# migration manually (see WriteDataSourceConfig / ReadDataSourceConfig).
spring.flyway.enabled=false

